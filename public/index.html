<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Match the status area to the saved theme before the app starts painting.
      try {
        if (JSON.parse(localStorage.getItem("themeMode")) === "light") {
          document.querySelector('meta[name="theme-color"]').content = "#ffffff";
          document.documentElement.style.setProperty("--app-background", "#ffffff");
        }
      } catch (_) {
        // Storage can be unavailable; the app's default theme is dark.
      }
    </script>
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: var(--app-background, #121212);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* iOS samples a real fixed element for the Home Screen status area's tint. */
      #status-bar-tint {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background-color: var(--app-background, #121212);
        pointer-events: none;
        z-index: 2147483647;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      window.addEventListener("load", function () {
        // Expo's development server has no generated sw.js. The exported site
        // has a hashed bundle under /_expo/static/js/web/.
        if (!('serviceWorker' in navigator) ||
            !document.querySelector('script[src*="/_expo/static/js/web/"]')) return;
        navigator.serviceWorker.register('/sw.js').catch(function (error) {
          console.warn('Offline support could not start:', error);
        });
      });
    </script>
    <script>
      // Nudge iOS Home Screen apps to repaint the blurred status bar edge.
      // This follows the workaround in solution.txt and runs once per load.
      window.addEventListener("load", function () {
        const isStandalone =
          matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true;
        if (!isStandalone || !/iPhone|iPad|iPod/.test(navigator.userAgent)) return;

        const style = document.createElement("style");
        style.textContent = `
          #ojapp-blur-cover {
            display: none; position: fixed; inset: 0; z-index: 2147483646;
            background: rgba(255,255,255,0.01); pointer-events: none;
            animation: ojapp-cover-fade 0.3s;
          }
          #ojapp-blur-panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 90%; height: 100%;
            z-index: 2147483647; background: rgba(255,255,255,0.01);
            pointer-events: none; transform: translateX(110%); transition: transform 0.3s;
          }
          @keyframes ojapp-cover-fade { from { opacity: 0; } to { opacity: 1; } }
        `;
        document.head.appendChild(style);

        const cover = document.createElement("div");
        cover.id = "ojapp-blur-cover";
        cover.setAttribute("aria-hidden", "true");
        const panel = document.createElement("div");
        panel.id = "ojapp-blur-panel";
        panel.setAttribute("aria-hidden", "true");
        document.body.append(cover, panel);
        void panel.offsetWidth;
        requestAnimationFrame(function () {
          cover.style.display = "block";
          panel.style.transform = "translateX(0%)";
          setTimeout(function () {
            cover.style.display = "none";
            panel.style.transform = "translateX(110%)";
          }, 500);
        });
      });
    </script>
  </head>

  <body>
    <div id="status-bar-tint" aria-hidden="true"></div>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
